name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, as in the release workflow (the comment
# beside each names the version; Dependabot proposes the bumps). Bun is the
# one package.json's `packageManager` names, and cargo works from Cargo.lock
# as it stands (`--locked`): a lockfile behind Cargo.toml fails here instead
# of resolving versions nobody chose.

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04, not ubuntu-latest: the base the release is built on
        # (the oldest system the app runs on — see release.yml).
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri v2 system libraries, plus the X11 headers rdev (copycopy's Linux
      # key listener) compiles against.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libx11-dev libxtst-dev libxi-dev

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # knip analyzes the site workspace too; without its node_modules the
      # astro/wrangler binaries are unresolvable and report as false positives.
      - name: Install site dependencies
        run: bun install --frozen-lockfile --cwd site

      # Frontend: lint, dead-code scan, format, type-check + build (also
      # produces dist/ and src-tauri/icons/, both embedded by the Rust build).
      - run: bun run lint
      - run: bun run lint:dead
      - run: bun run format:check
      - run: bun run lint:toml
      - run: bun run build

      # Backend.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo build --manifest-path src-tauri/Cargo.toml --locked
